name: Release

# Publishing a release in the GitHub UI (or pushing a tag like 1.2.3, no "v"
# prefix) validates, builds and attaches lions-theme.zip to that release.
# The tag is the source of truth for the version: bin/set-version.sh stamps it
# into theme/style.css and Theme::VERSION before the build, so no bump commit
# is required.

on:
  push:
    tags:
      - "*.*.*"

env:
  PHP_VERSION: "8.3"

permissions:
  contents: write

jobs:
  release:
    name: Validate, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v*)
              echo "Tag $TAG uses a 'v' prefix; tags are plain versions like ${TAG#v}."
              exit 1
              ;;
          esac
          sh bin/set-version.sh "$TAG" theme
          echo "Releasing version $TAG"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies (with dev tools for validation)
        working-directory: theme
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate
        run: |
          cd theme
          composer validate --strict --no-check-publish
          composer run lint:php
          composer run lint:phpcs
          composer run analyse
          cd ..
          php bin/twig-lint.php theme
          sh bin/validate-theme.sh theme

      - name: Build production package
        run: bash bin/build.sh

      # A release drafted in the GitHub UI creates the tag and the release object
      # itself, and the resulting tag push starts this run - so the release often
      # already exists here. Attach the package to it instead of failing, and leave
      # any notes written in the UI untouched.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading build/lions-theme.zip to it."
            gh release upload "$TAG" build/lions-theme.zip --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" build/lions-theme.zip \
              --title "Lions theme $TAG" \
              --generate-notes
          fi
